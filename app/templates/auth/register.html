<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت نام</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f4f6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #15803d;
        }

        .flash {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        p {
            text-align: center;
            margin-top: 15px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="register-box">

    <h2>ساخت حساب</h2>


    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}


    <form method="POST" action="{{ url_for('auth.register') }}">


        <input 
            type="hidden" 
            name="csrf_token" 
            value="{{ csrf_token() }}"
        >


        <input
            type="text"
            name="first_name"
            placeholder="نام"
            required
        >


        <input
            type="text"
            name="last_name"
            placeholder="نام خانوادگی"
            required
        >


        <input
            type="email"
            name="email"
            placeholder="ایمیل"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="رمز عبور"
            required
        >


        <button type="submit">
            ثبت نام
        </button>


    </form>


    <p>
        حساب دارید؟
        <a href="{{ url_for('auth.login') }}">
            ورود
        </a>
    </p>


</div>


</body>

</html>
