<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px #ccc;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .flash {
            color: red;
            text-align: center;
        }

    </style>

</head>


<body>

<div class="register-box">

    <h2>ساخت حساب</h2>


    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p class="flash">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}


    <form method="POST">

        {{ csrf_token() }}


        <input
            type="text"
            name="first_name"
            placeholder="نام"
            required
        >


        <input
            type="text"
            name="last_name"
            placeholder="نام خانوادگی"
            required
        >


        <input
            type="email"
            name="email"
            placeholder="ایمیل"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="رمز عبور"
            required
        >


        <button type="submit">
            ثبت نام
        </button>


    </form>


</div>

</body>

</html>
